---
- name: 임시 작업 디렉토리 생성
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ remote_temp_dir }}"
    - "{{ remote_temp_dir }}/rpms"

- name: 로컬에서 필요한 RPM 파일 검색 (Miniconda용)
  delegate_to: localhost
  become: no
  find:
    paths: "{{ local_files_path }}/rpms"
    patterns: "{{ item }}*.rpm"
  loop: "{{ miniconda_dependencies }}"
  register: local_rpm_files

- name: 필요한 RPM 패키지만 선별 복사
  copy:
    src: "{{ item.1.path }}"
    dest: "{{ remote_temp_dir }}/rpms/"
  with_subelements:
    - "{{ local_rpm_files.results }}"
    - files

- name: RPM 파일 목록 추출 (원격 서버)
  find:
    paths: "{{ remote_temp_dir }}/rpms"
    patterns: "*.rpm"
  register: found_rpm_files

- name: 필수 패키지 설치 (bzip2 등)
  yum:
    name: "{{ item.path }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ found_rpm_files.files }}"

- name: Miniconda 설치 관리자 복사
  copy:
    src: "{{ local_files_path }}/src/{{ miniconda_installer }}"
    dest: "{{ remote_temp_dir }}/{{ miniconda_installer }}"
    mode: '0755'

- name: Miniconda 무인 설치 실행
  shell: "{{ remote_temp_dir }}/{{ miniconda_installer }} -b -u -p {{ miniconda_install_dir }}"
  args:
    creates: "{{ miniconda_install_dir }}/bin/conda"

- name: 시스템 환경 변수 설정 (Profile.d)
  copy:
    dest: /etc/profile.d/miniconda.sh
    content: |
      export PATH="{{ miniconda_install_dir }}/bin:$PATH"
    mode: '0644'

- name: Conda 초기화 (Bash)
  shell: "{{ miniconda_install_dir }}/bin/conda init bash"
  args:
    executable: /bin/bash

- name: 임시 디렉토리 삭제
  file:
    path: "{{ remote_temp_dir }}"
    state: absent
