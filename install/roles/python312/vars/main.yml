---
python_version: "3.12.0"
openssl_version: "1.1.1w"

# 설치 경로 설정
python_install_dir: "/usr/local/python312"
openssl_install_dir: "/usr/local/openssl111"

# 소스 파일 이름
python_src_file: "Python-{{ python_version }}.tar.xz"
openssl_src_file: "openssl-{{ openssl_version }}.tar.gz"

# 빌드 필수 패키지 목록 (yum 모듈에서 사용)
build_dependencies:
  - gcc
  - make
  - libffi-devel
  - zlib-devel
  - bzip2-devel
  - readline-devel
  - sqlite-devel
  - xz-devel
  - openssl-devel
  - wget

# 충돌을 방지하기 위해 설치에서 제외할 패키지 패턴 (시스템 핵심 라이브러리)
exclude_patterns:
  - "krb5-libs"
  - "libkadm5"
  - "glibc"

# 바이너리 배포 파일 이름 (컴파일된 결과물)
python_bin_archive: "python312_bin.tar.gz"
openssl_bin_archive: "openssl111_bin.tar.gz"

# 로컬 파일 경로 (Ansible 실행 위치 기준)
local_files_path: "files"
local_bin_path: "files/binaries"
remote_temp_dir: "/tmp/python_install"
