---
- name: 임시 작업 디렉토리 생성
  file:
    path: "{{ remote_temp_dir }}"
    state: directory
    mode: '0755'

- name: RPM 의존성 패키지 복사
  copy:
    src: "{{ local_files_path }}/rpms/"
    dest: "{{ remote_temp_dir }}/rpms/"

- name: RPM 파일 목록 추출
  find:
    paths: "{{ remote_temp_dir }}/rpms"
    patterns: "*.rpm"
  register: found_rpm_files

- name: RPM 의존성 패키지 설치 (충돌 패키지 제외 및 정확한 경로 지정)
  yum:
    name: "{{ item }}"
    state: present
    disable_gpg_check: yes
  loop: >-
    {{
      found_rpm_files.files 
      | map(attribute='path') 
      | select('search', build_dependencies | join('|'))
      | reject('search', exclude_patterns | join('|'))
      | list
    }}
  register: yum_result

- name: 소스 코드 복사
  copy:
    src: "{{ local_files_path }}/src/"
    dest: "{{ remote_temp_dir }}/src/"

- name: OpenSSL 바이너리 배포 또는 빌드
  block:
    - name: 로컬에 OpenSSL 바이너리 존재 확인
      delegate_to: localhost
      become: no
      stat:
        path: "{{ local_bin_path }}/{{ openssl_bin_archive }}"
      register: openssl_bin_stat

    - name: OpenSSL 바이너리 배포 (로컬에 파일이 있는 경우)
      unarchive:
        src: "{{ local_bin_path }}/{{ openssl_bin_archive }}"
        dest: /
        remote_src: no
      when: openssl_bin_stat.stat.exists

    - name: OpenSSL 빌드 및 설치 (바이너리가 없는 경우)
      block:
        - name: OpenSSL 압축 해제
          unarchive:
            src: "{{ remote_temp_dir }}/src/{{ openssl_src_file }}"
            dest: "{{ remote_temp_dir }}"
            remote_src: yes

        - name: OpenSSL 설정 및 컴파일
          shell: |
            cd {{ remote_temp_dir }}/openssl-{{ openssl_version }}
            ./config --prefix={{ openssl_install_dir }} --openssldir={{ openssl_install_dir }} shared zlib
            make -j $(nproc)
            make install
          args:
            creates: "{{ openssl_install_dir }}/bin/openssl"
      when: not openssl_bin_stat.stat.exists

- name: Python 3.12 바이너리 배포 또는 빌드
  block:
    - name: 로컬에 Python 바이너리 존재 확인
      delegate_to: localhost
      become: no
      stat:
        path: "{{ local_bin_path }}/{{ python_bin_archive }}"
      register: python_bin_stat

    - name: Python 바이너리 배포 (로컬에 파일이 있는 경우)
      unarchive:
        src: "{{ local_bin_path }}/{{ python_bin_archive }}"
        dest: /
        remote_src: no
      when: python_bin_stat.stat.exists

    - name: Python 빌드 및 설치 (바이너리가 없는 경우)
      block:
        - name: Python 압축 해제
          unarchive:
            src: "{{ remote_temp_dir }}/src/{{ python_src_file }}"
            dest: "{{ remote_temp_dir }}"
            remote_src: yes

        - name: Python 설정
          shell: |
            cd {{ remote_temp_dir }}/Python-{{ python_version }}
            ./configure --prefix={{ python_install_dir }} \
                        --with-openssl={{ openssl_install_dir }} \
                        --with-openssl-rpath=auto \
                        --enable-optimizations
          args:
            chdir: "{{ remote_temp_dir }}/Python-{{ python_version }}"

        - name: Python 컴파일 및 설치
          shell: |
            cd {{ remote_temp_dir }}/Python-{{ python_version }}
            make -j $(nproc)
            make altinstall
          args:
            creates: "{{ python_install_dir }}/bin/python3.12"
      when: not python_bin_stat.stat.exists

- name: 심볼릭 링크 생성
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - { src: "{{ python_install_dir }}/bin/python3.12", dest: "/usr/local/bin/python3.12" }
    - { src: "{{ python_install_dir }}/bin/pip3.12", dest: "/usr/local/bin/pip3.12" }

- name: 임시 디렉토리 삭제
  file:
    path: "{{ remote_temp_dir }}"
    state: absent
