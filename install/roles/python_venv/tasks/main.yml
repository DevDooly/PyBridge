---
- name: 프로젝트 디렉토리 생성
  file:
    path: "{{ project_root }}"
    state: directory
    mode: '0755'

- name: 임시 작업 디렉토리 생성
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ remote_temp_dir }}"
    - "{{ remote_temp_dir }}/packages"

- name: requirements.txt 복사
  copy:
    src: "{{ local_requirements_path }}"
    dest: "{{ remote_temp_dir }}/requirements.txt"

- name: requirements.txt 패키지 목록 읽기
  set_fact:
    package_names: "{{ lookup('file', local_requirements_path).splitlines() | map('regex_replace', '==.*', '') | select('match', '^[a-zA-Z0-9]') | list }}"

- name: 로컬에서 필요한 WHL 파일 검색 (requirements 기반)
  delegate_to: localhost
  become: no
  find:
    paths: "{{ local_packages_path }}"
    patterns: "*.whl"
  register: local_whl_files

- name: 필요한 WHL 패키지만 선별 복사
  copy:
    src: "{{ item.path }}"
    dest: "{{ remote_temp_dir }}/packages/"
  loop: "{{ local_whl_files.files }}"
  when: >
    (item.path | basename | regex_replace('[-_].*', '') | lower) in 
    (package_names | map('lower') | list) or
    (item.path | basename | lower is search('pip|setuptools|wheel'))

- name: venv 가상환경 생성
  command: "{{ python_bin }} -m venv {{ venv_path }}"
  args:
    creates: "{{ venv_path }}/bin/activate"

- name: venv 내부의 pip/setuptools 업데이트 (오프라인)
  shell: |
    {{ venv_path }}/bin/pip install --no-index --find-links={{ remote_temp_dir }}/packages pip setuptools wheel --upgrade
  failed_when: false

- name: 오프라인 모듈 설치 (requirements.txt 활용)
  shell: |
    {{ venv_path }}/bin/pip install --no-index --find-links={{ remote_temp_dir }}/packages -r {{ remote_temp_dir }}/requirements.txt
  register: pip_install_result
  changed_when: "'Successfully installed' in pip_install_result.stdout"

- name: 임시 디렉토리 삭제
  file:
    path: "{{ remote_temp_dir }}"
    state: absent
